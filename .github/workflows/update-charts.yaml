name: update-charts

on:
  workflow_dispatch:
  schedule:
    - cron: '45 12 6 3 *'    # Mar 6, 2026 @ 8:45 a.m. EDT
    - cron: '45 12 3 4 *'    # Apr 3, 2026 @ 8:45 a.m. EDT
    - cron: '45 12 8 5 *'    # May 8, 2026 @ 8:45 a.m. EDT
    - cron: '45 12 5 6 *'    # Jun 5, 2026 @ 8:45 a.m. EDT
    - cron: '45 12 2 7 *'    # Jul 2, 2026 @ 8:45 a.m. EDT
    - cron: '45 12 7 8 *'    # Aug 7, 2026 @ 8:45 a.m. EDT
    - cron: '45 12 4 9 *'    # Sep 4, 2026 @ 8:45 a.m. EDT
    - cron: '45 12 2 10 *'   # Oct 2, 2026 @ 8:45 a.m. EDT
    - cron: '45 13 6 11 *'   # Nov 6, 2026 @ 8:45 a.m. EST
    - cron: '45 13 4 12 *'   # Dec 4, 2026 @ 8:45 a.m. EST

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyverse
            any::blsR
            any::jsonlite
            any::devtools
            any::dotenv
            any::janitor
            any::tidyr
            any::lubridate
            any::stringr
            any::xml2
            
            
      - name: Set environment variables
        run: |
          echo "DW_API_KEY=${{ secrets.DW_API_KEY }}" >> $GITHUB_ENV
          echo "BLS_API_KEY=${{ secrets.BLS_API_KEY }}" >> $GITHUB_ENV
          
      - name: Install DatawRappr package
        run: |
          Rscript -e "pak::pkg_install('munichrocker/DatawRappr')"
          
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run monthly unemployment script
        run: Rscript scripts/monthly-unemployment.R
        
      - name: Run monthly jobs script
        run: Rscript scripts/monthly-jobs.R
        
      - name: Run jobs by industry script
        run: Rscript scripts/jobs-by-industry.R


      - name: Commit and push results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git diff --cached --quiet || git commit -m 'Update results from R scripts'
          git push origin || echo "No changes to push"
      - name: Notify Slack on success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data '{
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "📊 Jobs Data Updated"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "The latest jobs charts are *live*. See <https://www.datawrapper.de/_/XlGvQ/|jobs> and <https://www.datawrapper.de/_/tZqDq/|unemployment rates>.\n\ncc: @moneywatch @paula.cohen"
                  }
                }
              ]
            }'
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data '{
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ Jobs data update failed"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "The *update-viz* workflow encountered an error. Charts may not be up to date.\n\ncc: @Grace Manthey"
                  }
                }
              ]
            }'    
