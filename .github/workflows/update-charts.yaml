name: update-charts

on:
  workflow_dispatch:

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyverse
            any::blsR
            any::jsonlite
            any::devtools
            any::dotenv
            any::janitor
            any::tidyr
            any::lubridate
            any::stringr
            any::xml2
            
            
      - name: Set environment variables
        run: |
          echo "DW_API_KEY=${{ secrets.DW_API_KEY }}" >> $GITHUB_ENV
          echo "BLS_API_KEY=${{ secrets.BLS_API_KEY }}" >> $GITHUB_ENV
          
      - name: Install DatawRappr package
        run: |
          Rscript -e "pak::pkg_install('munichrocker/DatawRappr')"
          
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run monthly unemployment script
        run: Rscript scripts/monthly-employment.R
        
      - name: Run monthly jobs script
        run: Rscript scripts/monthly-jobs.R
        
      - name: Run jobs by industry script
        run: Rscript scripts/jobs-by-industry.R


      - name: Commit and push results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git diff --cached --quiet || git commit -m 'Update results from R scripts'
          git push origin || echo "No changes to push"